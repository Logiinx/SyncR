<!doctype html>
<meta charset="utf-8">
<title></title>
<style>
  /* The same font as the app (index.css, 'SyncR UI'): keep the numbers the same */
  @font-face {
    font-family: 'SyncR UI';
    font-weight: 400;
    src: local('Segoe UI'), local('SegoeUI');
    ascent-override: 101%;
    descent-override: 32.5%;
    line-gap-override: 0%;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    display: flex;
    align-items: stretch;
    background: var(--bg, #161616);
    color: var(--text);
    font: 13px 'SyncR UI', sans-serif;
    user-select: none;
    cursor: default;
  }
  #title {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    padding: 0 12px;
  }
  #title span {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  button {
    width: 40px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    background: none;
    color: var(--text-dim);

    cursor: pointer;
  }
  button:hover { background: var(--hover); color: var(--text); }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  button[hidden] { display: none; }
  /* Watched: its name next to its icon */
  #watched { width: auto; gap: 6px; padding: 0 12px 0 10px; }
  /* Between the video's buttons, the title and the window's buttons */
  .line { width: 1px; flex-shrink: 0; margin: 8px 0; background: var(--border); }
  #via { display: none; flex-shrink: 0; margin-left: auto; padding-left: 12px; color: var(--text-dim); }
  #watched.on, #watched.on:hover { color: var(--text-green); }
  #on-top.on, #on-top.on:hover { color: var(--text-blue); }
  /* Minimize, maximize, close: the same as the main window (WindowControls.tsx) */
  #controls { display: flex; }
  #controls button { width: 46px; }
  #controls svg { width: 10px; height: 10px; stroke-width: 1.25; stroke-linecap: butt; stroke-linejoin: miter; overflow: visible; }
  #close:hover { background: #c94141; color: #fff; }
  /* Black player (Settings → Video): a thin line under the bar, so it doesn't blend into a dark video */
  body.black::after { content: ''; position: fixed; left: 0; right: 0; bottom: 0; height: 1px; background: var(--border); pointer-events: none; }
  /* Dim the bar when the mouse is away (Settings → Video): a dark cover fades in over it (fading the
     text itself would blur it), then goes at once when the mouse is back. When: watch_mouse in video_window.rs */
  #dim { position: fixed; inset: 0; z-index: 1; background: #000; opacity: 0; pointer-events: none; }
  body.away #dim { opacity: 0.75; transition: opacity 1.5s; }
  body.away.still #dim { transition: none; }
</style>
<button id="menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
<button id="watched"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span></span></button>
<div class="line"></div>
<div id="title"><span></span><div id="via"></div></div>
<button id="on-top"><svg viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg></button>
<button id="next-screen" hidden><svg viewBox="0 0 24 24"><path d="M13 3H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-3"/><path d="M8 21h8"/><path d="M12 17v4"/><path d="m17 8 5-5"/><path d="M17 3h5v5"/></svg></button>
<div class="line"></div>
<div id="controls">
  <button id="minimize"><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></button>
  <button id="maximize"><svg viewBox="0 0 10 10"></svg></button>
  <button id="close"><svg viewBox="0 0 10 10"><path d="M0.75 0.75l8.5 8.5M9.25 0.75l-8.5 8.5"/></svg></button>
</div>
<div id="dim"></div>
<script>
  // The bar of the video player window: this page only draws it and passes clicks on. The main
  // window sends all it needs in the address and does the work (videoPlayer.ts), the window
  // buttons go through video_window.rs (video_bar). Kept this small so it shows at once.
  const data = JSON.parse(new URLSearchParams(location.search).get('data') || '{}')
  const labels = data.labels || {}
  const $ = (id) => document.getElementById(id)
  const send = (action, on, details) => window.__TAURI_INTERNALS__?.invoke('video_bar', { action, on, ...details })

  for (const [name, color] of Object.entries(data.colors || {})) document.documentElement.style.setProperty(name, color)
  // The app's scale, as in the main window (the height of the bar is set in video_window.rs)
  if (data.zoom) document.documentElement.style.zoom = data.zoom
  document.body.classList.toggle('black', !!data.black)
  document.body.classList.toggle('still', data.animations === false)

  const title = $('title').firstElementChild
  window.setTitle = (text) => {
    title.textContent = text
    title.title = text
  }
  window.setTitle(data.title || '')
  // The rarely used ones (another way, open in browser, extensions) are in this menu
  $('menu').title = labels.more
  $('watched').lastElementChild.textContent = labels.watched
  $('on-top').title = labels.onTop
  $('minimize').title = labels.minimize
  $('close').title = labels.close

  // Called by the main window and video_window.rs as things change
  // The note: where the video continues. Gone after a moment, unless it's still of use.
  const NOTE_FOR = 6000
  let noteTimer
  window.setVia = (text, note, noteStays) => {
    clearTimeout(noteTimer)
    const shown = [note, text].filter(Boolean).join(' · ')
    $('via').textContent = shown
    $('via').style.display = shown ? 'block' : 'none'
    if (note && !noteStays) noteTimer = setTimeout(() => window.setVia(text), NOTE_FOR)
  }
  window.setVia(data.via || '', data.note || '', data.noteStays)
  let watched = false
  window.setWatched = (on) => {
    watched = on
    $('watched').classList.toggle('on', on)
    $('watched').title = on ? labels.unwatch : labels.watch
  }
  let onTop = false
  function showOnTop(on) {
    onTop = on
    $('on-top').classList.toggle('on', on)
  }
  window.setMaximized = (on) => {
    $('maximize').title = on ? labels.restore : labels.maximize
    $('maximize').firstElementChild.innerHTML = on
      ? '<rect x="0.625" y="2.625" width="6.75" height="6.75" rx="1"/><path d="M2.625 2.625V1.625a1 1 0 0 1 1-1h4.75a1 1 0 0 1 1 1v4.75a1 1 0 0 1-1 1H7.375"/>'
      : '<rect x="0.625" y="0.625" width="8.75" height="8.75" rx="1"/>'
  }
  // Only with two screens or more (video_window.rs counts them when the window opens or gets focus)
  // Its arrow points to the screen it moves to (way: from video_window.rs, '' when unknown)
  const SCREEN_ICONS = {
    right: '<path d="M13 3H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-3"/><path d="M8 21h8"/><path d="M12 17v4"/><path d="m17 8 5-5"/><path d="M17 3h5v5"/>',
    left: '<path d="M11 3h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-3"/><path d="M8 21h8"/><path d="M12 17v4"/><path d="m7 8-5-5"/><path d="M7 3H2v5"/>',
    up: '<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M12 17v4"/><path d="M8 21h8"/><path d="m9 10 3-3 3 3"/><path d="M12 13V7"/>',
    down: '<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M12 17v4"/><path d="M8 21h8"/><path d="M12 13V7"/><path d="m15 10-3 3-3-3"/>',
  }
  const SCREEN_LABELS = { right: labels.screenRight, left: labels.screenLeft, up: labels.screenUp, down: labels.screenDown }
  window.setScreens = (count, way) => {
    $('next-screen').hidden = count < 2
    $('next-screen').firstElementChild.innerHTML = SCREEN_ICONS[way] || SCREEN_ICONS.right
    $('next-screen').title = SCREEN_LABELS[way] || labels.nextScreen
  }
  window.setWatched(!!data.watched)
  showOnTop(!!data.onTop)
  window.setMaximized(false)
  window.setAway = (on) => document.body.classList.toggle('away', on)

  // Its list is a page of its own over the video (video-menu.html)
  $('menu').onclick = () => {
    const box = $('menu').getBoundingClientRect()
    send('menu', undefined, { left: box.left * devicePixelRatio, at: (box.left + box.width / 2) * devicePixelRatio })
  }
  $('watched').onclick = () => send('watched', !watched)
  $('on-top').onclick = () => {
    showOnTop(!onTop)
    send('always-on-top', onTop)
  }
  $('next-screen').onclick = () => send('next-screen')
  $('minimize').onclick = () => send('minimize')
  $('maximize').onclick = () => send('maximize')
  $('close').onclick = () => send('close')
  // The empty part of the bar moves the window; a double-click maximizes it
  $('title').onmousedown = (event) => {
    if (event.button === 0) send(event.detail === 2 ? 'maximize' : 'drag')
  }
  // With the dimming on, video_window.rs watches where the mouse is and calls setAway
  send('ready', !!data.dim)
</script>
