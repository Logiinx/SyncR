<!doctype html>
<meta charset="utf-8">
<title></title>
<style>html { background: #000 }</style>
<script>
  // Opens YouTube's player-only page for the video player window (videoPlayer.ts). Going through
  // this page gives it what it asks for, the address the visitor came from: opened directly, it
  // answers with error 153.
  const query = new URLSearchParams(location.search)
  const id = query.get('v') || ''
  const start = /^\d+$/.test(query.get('start') || '') ? `&start=${query.get('start')}` : ''
  // For video-watch.js. After the #, so it never goes to YouTube's servers.
  const wishes = new URLSearchParams()
  for (const name of ['quality', 'subtitles', 'language']) {
    if (/^[\w-]+$/.test(query.get(name) || '')) wishes.set(`syncr-${name}`, query.get(name))
  }
  if (/^[\w-]{6,20}$/.test(id)) location.replace(`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&iv_load_policy=3${start}#${wishes}`)
</script>
