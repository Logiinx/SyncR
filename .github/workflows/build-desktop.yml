# Builds the Windows installer for SyncR.
# - Push a tag like v0.1.0  -> builds and creates a DRAFT GitHub release with the installer.
# - "Run workflow" button   -> builds only; the installer is downloadable from the run page.
name: Build desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build and create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SyncR ${{ github.ref_name }}
          releaseDraft: true

      - name: Build only
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0

      - name: Upload installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: SyncR-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
