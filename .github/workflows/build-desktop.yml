# Builds the Windows installer for SyncR.
# - Push a tag like v0.1.0  -> builds and creates a DRAFT GitHub release with the installer.
# - "Run workflow" button   -> builds only; the installer is downloadable from the run page.
# - Push to main that changes src-tauri/ -> builds only, to keep the Rust cache fresh.
#   (A tag build can only reuse caches saved by main, not by earlier tags.)
name: Build desktop app

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['src-tauri/**', '.github/workflows/build-desktop.yml']
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Pinned: a new Rust version makes the whole cache useless. Bump it now and then.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Only main saves the cache (tag caches can't be reused by the next tag).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      # Takes this version's section (e.g. "## [0.2.0] ...") from both changelogs, for the release page
      # and the update bar. On GitHub: English, a line, a Français title, French. The app shows only the
      # part for its language: French after the hidden marker, English up to the line (WhatsNew.tsx).
      - name: Read release notes from the changelogs
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          section() {
            awk -v v="$version" '
              index($0, "## [" v "]") == 1 { found = 1; next }
              found && index($0, "## [") == 1 { exit }
              found { print }
            ' "$1"
          }
          notes=$(section CHANGELOG.md)
          french=$(section CHANGELOG.fr.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ] || [ -z "$(echo "$french" | tr -d '[:space:]')" ]; then
            echo "::error::No section for $version in CHANGELOG.md or CHANGELOG.fr.md"
            exit 1
          fi
          {
            echo 'body<<END_OF_NOTES'
            echo "$notes"
            echo
            echo '---'
            echo
            echo '### Français'
            echo
            echo '<!-- fr -->'
            echo
            echo "$french"
            echo 'END_OF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Build and create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SyncR ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true

      # Only runs if everything above succeeded. Publishing after the upload (instead of
      # releaseDraft: false) means installed apps never see a release without its update files.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"

      - name: Build only
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Rust tests (e.g. twitch.rs). After the build, which made dist/ that the app needs to compile.
      # Not on tags: the main push before a release already ran them.
      - name: Rust tests
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Upload installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: SyncR-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
