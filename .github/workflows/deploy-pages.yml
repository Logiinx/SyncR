# Publishes the phone / browser version of SyncR to GitHub Pages:
# https://logiinx.github.io/SyncR/
# - Push a tag like v0.4.0  -> publishes that version (same time as the desktop build).
# - "Run workflow" button   -> publishes the current main branch.
name: Deploy phone app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer one replaces a waiting one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The site lives under /SyncR/, not at the root of the domain
      - run: npm run build -- --base=/SyncR/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
