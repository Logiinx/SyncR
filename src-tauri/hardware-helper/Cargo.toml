[package]
name = "syncr-hardware"
version = "0.1.0"
description = "SyncR's admin helper: reads the CPU temperature for the Hardware module"
edition = "2024"
publish = false

# Its own program, built by SyncR's build.rs and carried inside SyncR (see src/main.rs)
[workspace]

[build-dependencies]
# SyncR's icon and the name Task Manager shows ("SyncR Hardware"), like SyncR's own (tauri-build)
tauri-winres = "0.3.6"

[dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell"] }

# As small as possible: it's built in one go with SyncR, so the slower optimizations cost little
[profile.release]
opt-level = "z"
strip = true
panic = "abort"
lto = true
codegen-units = 1
