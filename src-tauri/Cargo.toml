[package]
name = "syncr"
version = "0.1.0"
description = "SyncR - notes synced between PC and phone"
authors = ["Logiinx"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"

# The updater only exists on desktop (not Android/iOS).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Without the default "zip" feature: it only unpacks .zip/.tar.gz updates, and ours is the plain
# NSIS setup.exe. The zip crate yanked every version before 9.0.3 (2026-10), so with it the
# build can't find any version to use. The other two defaults are kept.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

# Windows DPAPI for secrets (lib.rs, dpapi). Same version Tauri already uses.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
