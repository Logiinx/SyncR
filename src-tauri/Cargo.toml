[package]
name = "syncr"
version = "0.1.0"
description = "SyncR - notes synced between PC and phone"
authors = ["Logiinx"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# unstable: the video player window holds two pages (lib.rs, open_video_player)
tauri = { version = "2.12.3", features = ["tray-icon", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
# "Save as" window for an email's attached files (lib.rs, save_attachment)
tauri-plugin-dialog = "2"
# Attached files come from Gmail as base64 text (lib.rs, attachment_bytes)
base64 = "0.22"
# The own Twitch player's video (lib.rs, player_answer). The same setup as the updater's, so
# nothing new gets built: rustls with ring, already there through tauri-plugin-updater.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# The updater only exists on desktop (not Android/iOS).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Without the default "zip" feature: it only unpacks .zip/.tar.gz updates, and ours is the plain
# NSIS setup.exe. The zip crate yanked every version before 9.0.3 (2026-10), so with it the
# build can't find any version to use. The other two defaults are kept.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

# Windows DPAPI for secrets (lib.rs, dpapi). Same version Tauri already uses.
# Also the mouse battery (mouse_battery.rs): the receiver (HID, SetupDi, file reads) and its strip in the
# taskbar (mouse_battery/strip.rs: drawing with GDI, windows, messages, tooltip, hover).
# The hardware module (hardware.rs): performance counters (CPU load, clock), memory status, nvml.dll;
# its admin helper (hardware_helper.rs): the pipe, Program Files, the admin prompt.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# The video window's extensions (video_extensions.rs): Tauri can only load a fixed folder and hides
# whether it worked. The same versions as Tauri's own, so nothing new gets built.
webview2-com = "0.39"
# Also gives the video window its own taskbar button (lib.rs, own_taskbar_button), and draws the
# Hardware widget (Direct2D + DirectWrite, hardware_widget.rs); windows-numerics: its points (already in the build, the same version).
# Also what Spotify plays, from Windows' media info (spotify.rs: Media_Control, Storage_Streams for the cover).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Storage_EnhancedStorage", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Media_Control", "Storage_Streams"] }
windows-numerics = "0.3.1"

# A smaller app (installer and updates): optimized for size, no debug symbols, stop at once on a
# crash. No LTO (one optimization pass over the whole program): it saved only ~60 KB of the
# 3.3 MB installer but cost ~1.5 min per GitHub build, as it can't be cached.
[profile.release]
opt-level = "s"
strip = true
panic = "abort"
