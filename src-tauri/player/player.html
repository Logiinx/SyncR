<!doctype html>
<html lang="en">
<meta charset="utf-8">
<!-- Twitch, the emote services and picture servers aren't told which page asks (data requests still
     say where they come from: browsers always do) -->
<meta name="referrer" content="no-referrer">
<title></title>
<style>
  /* The same font as the app (index.css, 'SyncR UI'): keep the numbers the same */
  @font-face {
    font-family: 'SyncR UI';
    font-weight: 400;
    src: local('Segoe UI'), local('SegoeUI');
    ascent-override: 101%;
    descent-override: 32.5%;
    line-gap-override: 0%;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #000; }
  body { color: #fff; font: 13px 'SyncR UI', sans-serif; user-select: none; cursor: default; }
  [hidden] { display: none !important; }
  svg { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  button { padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
  button:disabled, button.off { cursor: default; }

  #stage { position: fixed; inset: 0; display: flex; }
  #player { flex: 1; min-width: 0; background: #000; }
  video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }

  #bot-names { display: block; width: calc(100% - 8px); height: 30px; margin: 2px 4px 4px; padding: 0 8px; box-sizing: border-box; border: 0; border-radius: 6px; outline: none; background: var(--hover, #262626); color: inherit; font: inherit; font-size: 12px; user-select: text; }
  #bot-names::placeholder { color: var(--text-dim, #9a9a9a); }
  /* The chat's background in full screen: name, slider, value (white like the volume) */
  #chat-bg { display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 0 12px; }
  #chat-bg input { flex: 1; min-width: 0; margin: 0; accent-color: #fff; cursor: pointer; }
  #chat-bg output { width: 34px; text-align: right; color: var(--text-dim, #9a9a9a); font-variant-numeric: tabular-nums; }

  /* The games button (left end of the bar) and its list, bottoms in line with the ⚙️ menu */
  .game-art { width: 22px; height: 29px; flex: none; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 3px; }
  .game-art img { width: 100%; height: 100%; object-fit: cover; }
  .game-art svg { width: 20px; height: 20px; }
  #games-box { position: absolute; top: 18px; left: 12px; bottom: 62px; z-index: 5; display: flex; align-items: flex-end; pointer-events: none; }
  #games-list {
    min-width: 250px; max-width: 340px; max-height: 100%; overflow: auto; box-sizing: border-box; pointer-events: auto;
    scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
    padding: 6px; border-radius: 8px; background: var(--bg, #161616); border: 1px solid rgba(255, 255, 255, 0.14); color: var(--text, #e4e4e4);
  }
  .menu-item.game-line { justify-content: flex-start; gap: 10px; min-height: 44px; padding: 0 12px 0 8px; }
  .game-line .game-art { width: 27px; height: 36px; }
  .game-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .game-length { flex: none; color: var(--text-dim, #9a9a9a); font-size: 12px; font-variant-numeric: tabular-nums; }
  /* Under the name and length (after the box art), like the main bar: grey track, blue played part */
  .menu-item.game-line { position: relative; }
  .game-progress { position: absolute; left: 45px; right: 12px; bottom: 4px; height: 2px; border-radius: 1px; overflow: hidden; background: rgba(255, 255, 255, 0.25); pointer-events: none; }
  .game-progress span { display: block; height: 100%; width: 0; background: var(--text-blue, #6ea8fe); }

  #chat { position: relative; flex: none; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg, #161616); border-left: 1px solid rgba(255, 255, 255, 0.1); color: var(--text, #e4e4e4); }
  #chat-edge { position: absolute; top: 0; bottom: 0; left: -4px; width: 7px; z-index: 2; cursor: col-resize; touch-action: none; }
  html.resizing, html.resizing * { cursor: col-resize !important; }
  #chat-list { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; padding: 6px 0; line-height: 20px; user-select: text; cursor: auto; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.25) transparent; }
  .chat-line { zoom: var(--chat-size, 1); padding: 4px 10px; overflow-wrap: anywhere; }
  .chat-line:hover { background: var(--hover, #262626); }
  .chat-name { font-weight: 600; }
  .chat-time { margin-right: 5px; font-size: 12px; color: var(--text-dim, #9a9a9a); font-variant-numeric: tabular-nums; }
  .chat-badge { width: 18px; height: 18px; margin-right: 3px; vertical-align: -4px; }
  .chat-emote { height: 28px; margin: -4px 1px; vertical-align: middle; }
  /* In full screen, over the video. While the controls show it leaves them free. */
  #chat.over { position: absolute; z-index: 4; width: 340px; top: 0; bottom: 0; border: 0; background: color-mix(in srgb, var(--bg, #161616) var(--chat-bg, 55%), transparent); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9); }
  #player:not(.quiet) ~ #chat.over { bottom: 72px; }
  #chat.over.right, #chat.over.corner-right { right: 0; }
  #chat.over.left, #chat.over.corner-left { left: 0; }
  #chat.over.corner-right, #chat.over.corner-left, #player:not(.quiet) ~ #chat.over.corner-right, #player:not(.quiet) ~ #chat.over.corner-left { bottom: auto; height: 45%; }
  #chat.over #chat-edge { display: none; }
  #chat.over #chat-list { scrollbar-width: none; }
  #chat-note { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 20px; text-align: center; color: var(--text-dim, #9a9a9a); pointer-events: none; }
  #chat-latest { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); height: 28px; padding: 0 12px; border-radius: 6px; background: var(--accent, #2d4f7c); color: #fff; font-size: 12px; white-space: nowrap; }

</style>
<div id="stage">
<div id="player" class="paused loading" tabindex="-1">
  <video id="video" playsinline></video>
</div>
<div id="chat" hidden>
  <div id="chat-edge"></div>
  <div id="chat-list"></div>
  <div id="chat-note" hidden></div>
  <button id="chat-latest" hidden></button>
</div>
</div>
<script src="/hls.min.js"></script>
<script src="/controls.js"></script>
<script src="/player.js"></script>
<script src="/timeline.js"></script>
<script src="/chat.js"></script>
</html>
