<!doctype html>
<html lang="en">
<meta charset="utf-8">
<!-- Twitch, the emote services and picture servers aren't told which page asks (data requests still
     say where they come from: browsers always do) -->
<meta name="referrer" content="no-referrer">
<title></title>
<style>
  /* The same font as the app (index.css, 'SyncR UI'): keep the numbers the same */
  @font-face {
    font-family: 'SyncR UI';
    font-weight: 400;
    src: local('Segoe UI'), local('SegoeUI');
    ascent-override: 101%;
    descent-override: 32.5%;
    line-gap-override: 0%;
  }
  /* The chat's names: the real Semibold, not the regular letters thickened by the browser */
  @font-face {
    font-family: 'SyncR UI';
    font-weight: 500 600;
    src: local('Segoe UI Semibold'), local('SegoeUI-Semibold');
    ascent-override: 101%;
    descent-override: 32.5%;
    line-gap-override: 0%;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #000; }
  body { color: #fff; font: 13px 'SyncR UI', sans-serif; user-select: none; cursor: default; }
  [hidden] { display: none !important; }
  svg { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  button { padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
  button:disabled, button.off { cursor: default; }

  #stage { position: fixed; inset: 0; display: flex; }
  #player { flex: 1; min-width: 0; background: #000; }
  video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }

  #bot-names { display: block; width: calc(100% - 8px); height: 30px; margin: 2px 4px 4px; padding: 0 8px; box-sizing: border-box; border: 0; border-radius: 6px; outline: none; background: var(--hover, #262626); color: inherit; font: inherit; font-size: 12px; user-select: text; }
  #bot-names::placeholder { color: var(--text-dim, #9a9a9a); }

  /* The games button (right of the time) and the box art in its list (the list: controls.js) */
  .game-art { width: 22px; height: 29px; flex: none; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 3px; }
  .game-art img { width: 100%; height: 100%; object-fit: cover; }
  .game-art svg { width: 20px; height: 20px; }
  .part-line .game-art { width: 27px; height: 36px; }

  #chat { position: relative; flex: none; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg, #161616); border-left: 1px solid rgba(255, 255, 255, 0.1); color: var(--text, #e4e4e4); }
  #chat-edge { position: absolute; top: 0; bottom: 0; left: -4px; width: 7px; z-index: 2; cursor: col-resize; touch-action: none; }
  html.resizing, html.resizing * { cursor: col-resize !important; }
  #chat-list { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; padding: 6px 0; line-height: 20px; user-select: text; cursor: auto; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.25) transparent; }
  .chat-line { zoom: var(--chat-size, 1); padding: 4px 10px; overflow-wrap: anywhere; }
  .chat-line:hover { background: var(--hover, #262626); }
  .chat-name { font-weight: 600; }
  .chat-time { margin-right: 5px; font-size: 12px; color: var(--text-dim, #9a9a9a); font-variant-numeric: tabular-nums; }
  .chat-badge { width: 18px; height: 18px; margin-right: 3px; vertical-align: -4px; }
  .chat-emote { height: 28px; margin: -4px 1px; vertical-align: middle; }
  /* Hover card on an emote or badge (chat.js): the bigger picture, its name, an emote's source dim */
  #chat-tip { position: absolute; z-index: 3; max-width: 220px; padding: 8px 10px 6px; box-sizing: border-box; border-radius: 8px; background: var(--bg, #161616); border: 1px solid rgba(255, 255, 255, 0.14); color: var(--text, #e4e4e4); font-size: 12px; line-height: 16px; text-align: center; text-shadow: none; overflow-wrap: anywhere; pointer-events: none; }
  #chat-tip img { display: block; height: 56px; max-width: 200px; margin: 0 auto 4px; object-fit: contain; }
  #chat-tip img.badge { height: 36px; }
  #chat-tip div:last-child { color: var(--text-dim, #9a9a9a); }
  /* In full screen, over the video, full height, on frosted glass (the picture blurred behind it) */
  #stage { --chat-over: 340px; }
  #chat.over {
    position: absolute; z-index: 4; width: var(--chat-over); top: 0; bottom: 0; border: 0;
    background: color-mix(in srgb, var(--bg, #161616) 55%, transparent); backdrop-filter: blur(20px);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
  }
  #chat.over:is(.right, .top-right, .bottom-right) { right: 0; }
  #chat.over:is(.left, .top-left, .bottom-left) { left: 0; }
  #chat.over:is(.top-right, .top-left) { bottom: auto; height: 45%; }
  #chat.over:is(.bottom-right, .bottom-left) { top: auto; height: 45%; }
  #chat.over #chat-edge { display: none; }
  /* Full height on the right or left: the controls and the rest keep to the picture's part
     (chat-right / chat-left: chat.js). The corners leave them the whole width. */
  #stage.chat-right :is(#ui, #spinner, #message) { right: var(--chat-over); }
  #stage.chat-right :is(#menus, #endcard) { right: calc(var(--chat-over) + 12px); }
  #stage.chat-right #flash { left: calc(50% - var(--chat-over) / 2); }
  #stage.chat-left :is(#ui, #spinner, #message) { left: var(--chat-over); }
  #stage.chat-left #parts-box { left: calc(var(--chat-over) + 12px); }
  #stage.chat-left #flash { left: calc(50% + var(--chat-over) / 2); }
  /* In a top corner the chat covers the header's end: the header stops before it */
  #stage.chat-top-right #header { padding-right: calc(var(--chat-over) + 20px); }
  #stage.chat-top-left #header { padding-left: calc(var(--chat-over) + 20px); }
  /* In a bottom corner: the bar gets shorter, and what sits above its end moves beside the chat */
  #stage.chat-bottom-right #bottom { right: var(--chat-over); }
  #stage.chat-bottom-right :is(#menus, #endcard) { right: calc(var(--chat-over) + 12px); }
  #stage.chat-bottom-left #bottom { left: var(--chat-over); }
  #stage.chat-bottom-left :is(#parts-box, #start-skip, #start-back, #start-skip-card) { left: calc(var(--chat-over) + 12px); }
  /* Where the chat goes, in its menu (spotPicker in chat.js): small screens, the chosen part blue
     like the menu's switches */
  .spot-picker { padding: 4px 12px 6px; }
  .spot-screens { display: flex; gap: 12px; }
  .spot-screen { display: grid; width: 96px; height: 58px; box-sizing: border-box; border: 1px solid rgba(255, 255, 255, 0.45); border-radius: 5px; overflow: hidden; }
  .spot-screen.strips { grid-template-columns: 24px 1fr 24px; }
  .spot-screen.corners { grid-template: 1fr 1fr / 1fr 1fr; }
  .spot-screen button { border-radius: 0; transition: background 0.15s; }
  .spot-screen button:hover { background: color-mix(in srgb, var(--accent, #2d4f7c) 35%, transparent); }
  .spot-screen button.on { background: var(--accent, #2d4f7c); }
  .strips button:first-child, .corners button:nth-child(odd) { border-right: 1px solid rgba(255, 255, 255, 0.45); }
  .strips button:last-child { border-left: 1px solid rgba(255, 255, 255, 0.45); }
  .corners button:nth-child(-n + 2) { border-bottom: 1px solid rgba(255, 255, 255, 0.45); }
  .spot-name { margin-top: 8px; font-size: 12px; line-height: 16px; color: var(--text-dim, #9a9a9a); }
  #chat.side.left { order: -1; border-left: 0; border-right: 1px solid rgba(255, 255, 255, 0.1); }
  #chat.side.left #chat-edge { left: auto; right: -4px; }
  #chat.over #chat-list { scrollbar-width: none; }
  #chat-note { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 20px; text-align: center; color: var(--text-dim, #9a9a9a); pointer-events: none; }
  #chat-latest { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); height: 28px; padding: 0 12px; border-radius: 6px; background: var(--accent, #2d4f7c); color: #fff; font-size: 12px; white-space: nowrap; }

</style>
<div id="stage">
<div id="player" class="paused loading" tabindex="-1">
  <video id="video" playsinline></video>
</div>
<div id="chat" hidden>
  <div id="chat-edge"></div>
  <div id="chat-list"></div>
  <div id="chat-note" hidden></div>
  <button id="chat-latest" hidden></button>
</div>
</div>
<script src="/hls.min.js"></script>
<script src="/controls.js"></script>
<script src="/startSkip.js"></script>
<script src="/player.js"></script>
<script src="/timeline.js"></script>
<script src="/previews.js"></script>
<script src="/chat.js"></script>
</html>
